# Infra aislada para la prueba de carga: otros nombres, otros puertos y datos
# en tmpfs, para no tocar el stack de desarrollo ni sus volúmenes.
name: comedor-carga

services:
  postgres:
    container_name: comedor-carga-postgres
    image: postgres:15
    command: postgres -c max_connections=300
    environment:
      POSTGRES_DB: comedor_uni
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../config/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql

  redis:
    container_name: comedor-carga-redis
    image: redis:7
    ports:
      - "6380:6379"

  rabbitmq:
    container_name: comedor-carga-rabbitmq
    image: rabbitmq:3-management
    ports:
      - "5673:5672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
