networks:
  tsdb-network:
    driver: bridge

services:
  postgres-tsdb:
    image: timescale/timescaledb:latest-pg15
    container_name: postgres-tsdb
    environment:
      POSTGRES_DB: comedor_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    volumes:
      - ./001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    networks:
      - tsdb-network

  app-tsdb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-tsdb
    environment:
      DB_HOST: postgres-tsdb
      DB_NAME: comedor_db
      DB_USER: postgres
      DB_PASSWORD: password123
      DB_PORT: "5432"
    ports:
      - "8001:8000"
    depends_on:
      - postgres-tsdb
    networks:
      - tsdb-network
